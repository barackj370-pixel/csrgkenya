<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <!-- Ring -->
  <ellipse cx="300" cy="280" rx="190" ry="40" fill="none" stroke="#181818" stroke-width="22"/>

  <!-- Left Figure (Purple) -->
  <g fill="#342c6a" stroke="#342c6a" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="190" cy="90" r="24" stroke="none"/>
    <line x1="190" y1="130" x2="110" y2="40" stroke-width="18"/>
    <line x1="190" y1="130" x2="270" y2="40" stroke-width="18"/>
    <polygon points="175,130 205,130 240,240 140,240" stroke="none"/>
    <rect x="165" y="230" width="16" height="70" stroke="none"/>
    <rect x="199" y="230" width="16" height="70" stroke="none"/>
  </g>

  <!-- Right Figure (Black) -->
  <g fill="#181818" stroke="#181818" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="410" cy="90" r="24" stroke="none"/>
    <line x1="410" y1="130" x2="330" y2="40" stroke-width="18"/>
    <line x1="410" y1="130" x2="490" y2="40" stroke-width="18"/>
    <rect x="385" y="130" width="50" height="110" stroke="none"/>
    <rect x="390" y="230" width="16" height="70" stroke="none"/>
    <rect x="414" y="230" width="16" height="70" stroke="none"/>
  </g>

  <!-- Front Figure (Blue) -->
  <g fill="#0071bc" stroke="#0071bc" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="300" cy="140" r="32" stroke="none"/>
    <line x1="300" y1="190" x2="120" y2="80" stroke-width="24"/>
    <line x1="300" y1="190" x2="480" y2="80" stroke-width="24"/>
    <rect x="270" y="190" width="60" height="120" stroke="none"/>
    <rect x="276" y="300" width="20" height="70" stroke="none"/>
    <rect x="304" y="300" width="20" height="70" stroke="none"/>
  </g>

  <!-- Text -->
  <g transform="translate(300, 420)">
    <text x="0" y="0" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="76" fill="#0071bc" text-anchor="middle" textLength="500" lengthAdjust="spacingAndGlyphs">CIVIL SOCIETY</text>
  </g>
  <g transform="translate(300, 460)">
    <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="34" fill="#5e5e5e" text-anchor="middle" textLength="480" lengthAdjust="spacingAndGlyphs">REFERENCE GROUP (CSRG)</text>
  </g>
</svg>
